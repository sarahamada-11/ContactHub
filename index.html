<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactHub</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">

            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-address-book"></i>
                </div>

                <h1>Contact<span>Hub</span></h1>
            </div>

            <div class="nav-actions">
                <button class="add-btn" id="addContactBtn">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add</span>
                </button>

                <img
                    src="https://i.pravatar.cc/100?img=12"
                    alt="Profile"
                    class="profile-img"
                >
            </div>

        </div>
    </header>


    <!-- Main Content -->
    <main class="main-container">

        <!-- Statistics -->
        <section class="stats-grid">

            <div class="stat-card">
                <div class="stat-icon total-icon">
                    <i class="fa-solid fa-users"></i>
                </div>

                <div class="stat-info">
                    <p>TOTAL</p>
                    <h2 id="totalCount">0</h2>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon favorite-icon">
                    <i class="fa-solid fa-star"></i>
                </div>

                <div class="stat-info">
                    <p>FAVORITES</p>
                    <h2 id="favoriteCount">0</h2>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon emergency-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <div class="stat-info">
                    <p>EMERGENCY</p>
                    <h2 id="emergencyCount">0</h2>
                </div>
            </div>

        </section>


        <!-- All Contacts -->
        <section class="contacts-section">

            <div class="section-heading">
                <h2>All Contacts</h2>
                <p id="contactsSubtitle">
                    Manage and organize your 0 contacts
                </p>
            </div>

            <!-- Search -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search by name, phone, or email..."
                >
            </div>

            <!-- Contacts List -->
            <div class="contacts-grid" id="contactsList">

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <i class="fa-solid fa-address-book"></i>
                    </div>

                    <h3>No contacts found</h3>
                    <p>Click "Add Contact" to get started</p>
                </div>

            </div>

        </section>


        <!-- Favorites -->
        <section class="extra-section favorites-section">

            <div class="extra-header">
                <div class="extra-title">
                    <div class="extra-icon favorite-icon">
                        <i class="fa-solid fa-star"></i>
                    </div>

                    <div>
                        <h2>Favorites</h2>
                        <p>Quick access</p>
                    </div>
                </div>
            </div>

            <div class="extra-content" id="favoritesList">
                <p class="section-empty">No favorites yet</p>
            </div>

        </section>


        <!-- Emergency Contacts -->
        <section class="extra-section emergency-section">

            <div class="extra-header">
                <div class="extra-title">
                    <div class="extra-icon emergency-icon">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>

                    <div>
                        <h2>Emergency</h2>
                        <p>Urgent contacts</p>
                    </div>
                </div>
            </div>

            <div class="extra-content" id="emergencyList">
                <p class="section-empty">No emergency contacts</p>
            </div>

        </section>

    </main>


    <!-- Add / Edit Contact Modal -->
    <div class="modal-overlay" id="contactModal">

        <div class="modal-box">

            <div class="modal-header">
                <div>
                    <h2 id="modalTitle">Add New Contact</h2>
                    <p>Save a new contact to your list</p>
                </div>

                <button
                    type="button"
                    class="close-modal"
                    id="closeModalBtn"
                    aria-label="Close"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="contactForm">

                <div class="form-group">
                    <label for="contactName">Full Name *</label>
                    <input
                        type="text"
                        id="contactName"
                        placeholder="Enter full name"
                        required
                        minlength="2"
                        maxlength="60"
                    >
                </div>

                <div class="form-group">
                    <label for="contactPhone">Phone Number *</label>
                    <input
                        type="tel"
                        id="contactPhone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contactEmail">Email Address *</label>
                    <input
                        type="email"
                        id="contactEmail"
                        placeholder="Enter email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contactAddress">Address</label>
                    <input
                        type="text"
                        id="contactAddress"
                        placeholder="Enter address"
                    >
                </div>

                <div class="form-group">
                    <label for="contactGroup">Group</label>
                    <select id="contactGroup">
                        <option value="Family">Family</option>
                        <option value="Friends">Friends</option>
                        <option value="Work">Work</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-options">

                    <label class="check-option">
                        <input type="checkbox" id="isFavorite">
                        <i class="fa-solid fa-star"></i>
                        Add to Favorites
                    </label>

                    <label class="check-option emergency-option">
                        <input type="checkbox" id="isEmergency">
                        <i class="fa-solid fa-heart-pulse"></i>
                        Emergency Contact
                    </label>

                </div>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelModalBtn"
                    >
                        Cancel
                    </button>

                    <button type="submit" class="save-btn">
                        <i class="fa-solid fa-check"></i>
                        Save Contact
                    </button>
                </div>

            </form>

        </div>

    </div>


    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JavaScript File -->
    <script src="./script.js"></script>

</body>
</html>
